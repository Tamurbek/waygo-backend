<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${title})}"></head>
<body>
    <div th:replace="~{admin/fragments :: sidebar('passengers')}"></div>

    <div class="main-content">
        <h1 th:text="${title}">Mijozlar</h1>
        <div th:if="${param.success}" style="padding: 0.75rem; margin-top: 1rem; border-radius: 0.5rem; background: rgba(0, 255, 128, 0.15); color: var(--success); border: 1px solid rgba(0, 255, 128, 0.3); font-size: 0.9rem;">
            ✓ Muvaffaqiyatli bajarildi!
        </div>
        <div th:if="${param.error}" style="padding: 0.75rem; margin-top: 1rem; border-radius: 0.5rem; background: rgba(239, 68, 68, 0.15); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.3); font-size: 0.9rem;">
            ✕ Xatolik: <span th:text="${param.error}"></span>
        </div>

        <div class="card" style="margin-top: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <h2 style="font-size: 1.125rem;">Barcha mijozlar (Yo'lovchilar)</h2>
                <div style="font-size: 0.875rem; color: var(--text-dim);" th:text="|${#lists.size(passengers)} ta foydalanuvchi|">0 ta</div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Avatar</th>
                        <th>Ism</th>
                        <th>Telefon</th>
                        <th>Ro'yxatdan o'tgan</th>
                        <th>Amallar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="passenger : ${passengers}">
                        <td>
                            <div style="position: relative; width: 40px; height: 40px; flex-shrink: 0;">
                                <th:block th:if="${!#strings.isEmpty(passenger.imageUrl)}">
                                    <img th:src="${passenger.imageUrl}" class="avatar"
                                         style="width:40px;height:40px;border-radius:50%;object-fit:cover;"
                                         th:onerror="'this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';'"
                                    >
                                    <div th:text="${passenger.initials}"
                                         style="display:none;width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:0.9rem;align-items:center;justify-content:center;">
                                    </div>
                                </th:block>
                                <th:block th:if="${#strings.isEmpty(passenger.imageUrl)}">
                                    <div th:text="${passenger.initials}"
                                         style="display:flex;width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:0.9rem;align-items:center;justify-content:center;">
                                    </div>
                                </th:block>
                            </div>
                        </td>
                        <td style="font-weight: 500;">
                            <span th:text="${passenger.fullName != null ? passenger.fullName : 'Kiritilmagan'}">Aziz</span>
                            <span th:if="${passenger.active != null and !passenger.active}" class="status-badge" style="background: rgba(239, 68, 68, 0.12); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.2); padding: 0.1rem 0.4rem; font-size: 0.65rem; border-radius: 4px; font-weight: 600; text-transform: none; margin-left: 0.4rem;">O'chirilgan</span>
                        </td>
                        <td th:text="${passenger.phone}">+998...</td>
                        <td style="color: var(--text-dim); font-size: 0.85rem;" th:text="${#temporals.format(passenger.createdAt, 'dd.MM.yyyy HH:mm')}">Date</td>
                        <td style="display: flex; gap: 0.5rem;">
                            <a href="#" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.75rem;">Tarix</a>
                            <form th:if="${passenger.active != null and !passenger.active}" th:action="${'/admin/passengers/' + passenger.id + '/reactivate'}" method="post"
                                  onsubmit="return confirm('Ushbu mijoz hisobini qayta faollashtirmoqchimisiz? Asl telefon raqami va ismi tiklanadi.');">
                                <button type="submit" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.75rem; color: var(--success); border-color: rgba(0, 255, 128, 0.3);">Faollashtirish</button>
                            </form>
                            <form th:action="${'/admin/passengers/' + passenger.id + '/delete'}" method="post"
                                  onsubmit="return confirm('Haqiqatan ham ushbu mijozni butunlay o\'chirmoqchimisiz? Bu amalni ortga qaytarib bo\'lmaydi!');">
                                <button type="submit" class="btn btn-danger" style="padding: 0.4rem 0.8rem; font-size: 0.75rem;">O'chirish</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(passengers)}">
                        <td colspan="5" style="text-align: center; color: var(--text-dim); padding: 4rem;">Mijozlar mavjud emas</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
<script th:replace="~{admin/fragments :: scripts}"></script>
</body>
</html>
