<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${title})}"></head>
<body>

    <div th:replace="~{admin/fragments :: sidebar('config_tariffs')}"></div>

    <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1 th:text="${title}" style="margin: 0;">Tarif Rejalari</h1>
            <button class="btn btn-primary" onclick="document.getElementById('addModal').classList.add('active')">
                <i class="ph ph-plus-circle"></i> Yangi Tarif Qo'shish
            </button>
        </div>
        
        <div th:if="${param.success}" class="card" style="background: rgba(25, 135, 84, 0.1); border-color: var(--success); margin-bottom: 2rem;">
            <div style="color: var(--success); font-weight: 600; display: flex; align-items: center; gap: 0.5rem;"><i class="ph ph-check-circle" style="font-size: 1.25rem;"></i> Tarif muvaffaqiyatli saqlandi!</div>
        </div>
        
        <div th:if="${param.updated}" class="card" style="background: rgba(13, 110, 253, 0.1); border-color: var(--primary); margin-bottom: 2rem;">
            <div style="color: var(--primary); font-weight: 600; display: flex; align-items: center; gap: 0.5rem;"><i class="ph ph-check-circle" style="font-size: 1.25rem;"></i> Tarif muvaffaqiyatli yangilandi!</div>
        </div>

        <div th:if="${param.deleted}" class="card" style="background: rgba(220, 53, 69, 0.1); border-color: var(--error); margin-bottom: 2rem;">
            <div style="color: var(--error); font-weight: 600; display: flex; align-items: center; gap: 0.5rem;"><i class="ph ph-trash" style="font-size: 1.25rem;"></i> Tarif o'chirildi!</div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Mavjud Tariflar</h3>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Muddati</th>
                        <th>Narxi</th>
                        <th>Aktivlik</th>
                        <th style="text-align: right;">Amallar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${tariffs}">
                        <td>
                            <strong th:text="${t.duration}"></strong> <span style="font-size: 0.8rem; color: var(--text-dim);" th:text="'(' + ${t.durationDays} + ' kun)'"></span><br>
                            <span th:if="${t.isPopular}" class="status-badge status-pending" style="margin-top: 0.5rem;"><i class="ph ph-star-fill"></i> Ommabop</span>
                            <span th:if="${t.isVip}" class="status-badge" style="margin-top: 0.5rem; background: rgba(255, 193, 7, 0.15); color: #ffc107; border: 1px solid rgba(255, 193, 7, 0.3); display: inline-flex; align-items: center; gap: 0.25rem;"><i class="ph ph-crown"></i> VIP</span>
                        </td>
                        <td>
                            <span style="font-weight: 600;" th:text="${#numbers.formatDecimal(t.price, 0, 'COMMA', 0, 'POINT')} + ' UZS'"></span><br>
                            <del th:if="${t.oldPrice != null}" style="color: var(--text-dim); font-size: 0.8rem;" th:text="${#numbers.formatDecimal(t.oldPrice, 0, 'COMMA', 0, 'POINT')} + ' UZS'"></del>
                        </td>
                        <td>
                            <label class="switch">
                                <input type="checkbox" th:checked="${t.isActive}" 
                                       th:data-id="${t.id}" 
                                       onchange="toggleActive(this.dataset.id)">
                                <span class="slider"></span>
                            </label>
                        </td>
                        <td style="text-align: right;">
                            <div class="actions" style="justify-content: flex-end;">
                                <a th:href="@{/admin/config/tariffs(edit=${t.id})}" class="btn-icon btn-icon-edit" title="Tahrirlash">
                                    <i class="ph ph-pencil-simple" style="font-size: 1.25rem;"></i>
                                </a>
                                <form th:action="@{/admin/config/tariffs/delete/{id}(id=${t.id})}" method="post" onsubmit="return confirm('Rostdan ham o\'chirmoqchimisiz?');" style="display: inline;">
                                    <button type="submit" class="btn-icon btn-icon-delete" title="O'chirish">
                                        <i class="ph ph-trash" style="font-size: 1.25rem;"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tariffs)}">
                        <td colspan="4" style="text-align: center; color: var(--text-dim); padding: 3rem 1rem;">
                            <i class="ph ph-tag" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;"></i><br>
                            Tizimda tariflar mavjud emas
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Modal -->
    <div id="addModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Yangi Tarif Qo'shish</h3>
                <button type="button" class="modal-close" onclick="document.getElementById('addModal').classList.remove('active')"><i class="ph ph-x" style="font-size: 1.25rem;"></i></button>
            </div>
            <form th:action="@{/admin/config/tariffs/add}" method="post">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Muddati nomi (masalan, "1 kunlik", "1 oy")</label>
                        <input type="text" name="duration" required class="form-control" placeholder="1 kunlik">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Muddati tarjimalari</label>
                        <div th:replace="~{admin/fragments :: translationInputs('durationTranslations', ${activeLanguages}, null)}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Amal qilish muddati (Kunlarda)</label>
                        <input type="number" name="durationDays" min="1" required class="form-control" placeholder="Masalan: 1, 7, 30">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Narxi (UZS)</label>
                        <input type="number" step="0.01" name="price" required class="form-control" placeholder="Masalan: 12000">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Eski Narxi (Ixtiyoriy, UZS)</label>
                        <input type="number" step="0.01" name="oldPrice" class="form-control" placeholder="Masalan: 15000">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Tavsif (Ixtiyoriy)</label>
                        <textarea name="description" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tavsif tarjimalari</label>
                        <div th:replace="~{admin/fragments :: translationInputs('descriptionTranslations', ${activeLanguages}, null)}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Tarif imkoniyatlari</label>
                        <div id="addFeaturesList"></div>
                        <button type="button" class="btn btn-outline" onclick="addFeatureRow('addFeaturesList')" style="margin-top: 0.5rem;">
                            <i class="ph ph-plus"></i> Imkoniyat qo'shish
                        </button>
                    </div>

                    <div class="form-group">
                        <label class="form-check">
                            <input type="checkbox" name="isPopular" value="true" class="form-check-input">
                            <span class="form-check-label">Ommabop (Popular) belgisi</span>
                        </label>
                    </div>

                    <div class="form-group">
                        <label class="form-check">
                            <input type="checkbox" name="active" value="true" checked class="form-check-input">
                            <span class="form-check-label">Aktiv (Haydovchilarga ko'rinadi)</span>
                        </label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="document.getElementById('addModal').classList.remove('active')">Bekor qilish</button>
                    <button type="submit" class="btn btn-primary"><i class="ph ph-plus-circle"></i> Qo'shish</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Modal (Rendered only if editItem is present) -->
    <div id="editModal" th:if="${editItem != null}" class="modal-overlay active">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Tarifni Tahrirlash</h3>
                <a th:href="@{/admin/config/tariffs}" class="modal-close"><i class="ph ph-x" style="font-size: 1.25rem;"></i></a>
            </div>
            <form th:action="@{'/admin/config/tariffs/edit/' + ${editItem.id}}" method="post">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Muddati nomi (masalan, "1 kunlik", "1 oy")</label>
                        <input type="text" name="duration" th:value="${editItem.duration}" required class="form-control" placeholder="1 kunlik">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Muddati tarjimalari</label>
                        <div th:replace="~{admin/fragments :: translationInputs('durationTranslations', ${activeLanguages}, ${editDurationTranslations})}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Amal qilish muddati (Kunlarda)</label>
                        <input type="number" name="durationDays" th:value="${editItem.durationDays}" min="1" required class="form-control" placeholder="Masalan: 1, 7, 30">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Narxi (UZS)</label>
                        <input type="number" step="0.01" name="price" th:value="${editItem.price}" required class="form-control" placeholder="Masalan: 12000">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Eski Narxi (Ixtiyoriy, UZS)</label>
                        <input type="number" step="0.01" name="oldPrice" th:value="${editItem.oldPrice}" class="form-control" placeholder="Masalan: 15000">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Tavsif (Ixtiyoriy)</label>
                        <textarea name="description" th:text="${editItem.description}" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tavsif tarjimalari</label>
                        <div th:replace="~{admin/fragments :: translationInputs('descriptionTranslations', ${activeLanguages}, ${editDescriptionTranslations})}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Tarif imkoniyatlari</label>
                        <div id="editFeaturesList">
                            <div class="feature-row" th:each="f, iter : ${editItem.features}" style="border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.75rem; margin-bottom: 0.75rem;">
                                <div style="display: flex; gap: 0.5rem; align-items: center;">
                                    <input type="text" th:name="'features[' + ${iter.index} + ']'" th:value="${f}" class="form-control" placeholder="Masalan: Cheksiz qo'ng'iroq">
                                    <button type="button" class="btn-icon btn-icon-delete" onclick="this.closest('.feature-row').remove(); reindexFeatureRows('editFeaturesList')">
                                        <i class="ph ph-trash"></i>
                                    </button>
                                </div>
                                <div th:replace="~{admin/fragments :: translationInputs('featureTranslations[' + ${iter.index} + ']', ${activeLanguages}, ${editFeatureTranslations != null and editFeatureTranslations.size() > iter.index ? editFeatureTranslations[iter.index] : null})}"></div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-outline" onclick="addFeatureRow('editFeaturesList')" style="margin-top: 0.5rem;">
                            <i class="ph ph-plus"></i> Imkoniyat qo'shish
                        </button>
                    </div>

                    <div class="form-group">
                        <label class="form-check">
                            <input type="checkbox" name="isPopular" value="true" th:checked="${editItem.popular}" class="form-check-input">
                            <span class="form-check-label">Ommabop (Popular) belgisi</span>
                        </label>
                    </div>

                    <div class="form-group">
                        <label class="form-check">
                            <input type="checkbox" name="active" value="true" th:checked="${editItem.active}" class="form-check-input">
                            <span class="form-check-label">Aktiv (Haydovchilarga ko'rinadi)</span>
                        </label>
                    </div>
                </div>
                <div class="modal-footer">
                    <a th:href="@{/admin/config/tariffs}" class="btn btn-outline">Bekor qilish</a>
                    <button type="submit" class="btn btn-primary"><i class="ph ph-floppy-disk"></i> Saqlash</button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        const ACTIVE_LANGUAGES = /*[[${activeLanguages}]]*/ [];

        function toggleActive(id) {
            fetch('/admin/config/tariffs/toggle-active/' + id, { method: 'POST' })
                .then(response => {
                    if(!response.ok) alert('Xatolik yuz berdi');
                });
        }

        // Appends a new (empty) feature row with one input per active language, matching
        // the server-rendered rows' markup/naming so reindexFeatureRows can treat them uniformly.
        function addFeatureRow(containerId) {
            const container = document.getElementById(containerId);
            const index = container.children.length;
            const row = document.createElement('div');
            row.className = 'feature-row';
            row.style.cssText = 'border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.75rem; margin-bottom: 0.75rem;';

            let translationsHtml = '';
            ACTIVE_LANGUAGES.forEach(function (lang) {
                translationsHtml += '<div style="display:flex; align-items:center; gap:0.5rem; margin-top:0.5rem;">' +
                    '<span style="width:5.5rem; flex-shrink:0; font-size:0.8rem; color:var(--text-dim);">' +
                    (lang.flagEmoji || '') + ' ' + lang.code + '</span>' +
                    '<input type="text" class="form-control" name="featureTranslations[' + index + '][' + lang.code + ']" placeholder="' + lang.name + '">' +
                    '</div>';
            });

            row.innerHTML =
                '<div style="display: flex; gap: 0.5rem; align-items: center;">' +
                '<input type="text" name="features[' + index + ']" class="form-control" placeholder="Masalan: Cheksiz qo\'ng\'iroq">' +
                '<button type="button" class="btn-icon btn-icon-delete" onclick="this.closest(\'.feature-row\').remove(); reindexFeatureRows(\'' + containerId + '\')">' +
                '<i class="ph ph-trash"></i></button></div>' + translationsHtml;
            container.appendChild(row);
        }

        // Renumbers features[i]/featureTranslations[i][lang] after a row is removed so
        // the submitted list stays contiguous (0..n-1) and aligned with the backend's
        // index-based translation key matching.
        function reindexFeatureRows(containerId) {
            const rows = document.getElementById(containerId).children;
            Array.from(rows).forEach(function (row, index) {
                const nameInput = row.querySelector('input[name^="features"]');
                if (nameInput) nameInput.name = 'features[' + index + ']';
                row.querySelectorAll('input[name^="featureTranslations"]').forEach(function (input) {
                    const match = input.name.match(/\[([^\[\]]+)\]$/);
                    const lang = match ? match[1] : '';
                    input.name = 'featureTranslations[' + index + '][' + lang + ']';
                });
            });
        }
    </script>
<script th:replace="~{admin/fragments :: scripts}"></script>
</body>
</html>
