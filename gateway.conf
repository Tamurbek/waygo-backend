server {
    listen 80;
    server_name localhost;

    # Max upload size (for driver documents, profile photos, etc.)
    client_max_body_size 100M;

    # WebSocket support
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Self-hosted OSRM routing fallback (see docker-compose.prod.yml's
    # `osrm` service and osrm/setup.sh). Resolved at REQUEST time via a
    # variable + Docker's embedded DNS (127.0.0.11), not at nginx startup —
    # deliberate, since the `osrm` container may not exist yet (data not
    # prepared via setup.sh). A static `proxy_pass http://osrm:5000/;`
    # would fail DNS resolution at config load whenever that container
    # isn't running, which would take the WHOLE gateway down, not just this
    # path. This way an unset-up/stopped osrm service only 502s requests to
    # /osrm/ itself — every other route keeps working.
    resolver 127.0.0.11 valid=30s;
    location /osrm/ {
        set $osrm_upstream http://osrm:5000/;
        proxy_pass $osrm_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
