services:
  db:
    image: postgres:15-alpine
    container_name: waygo_db_container
    restart: always
    environment:
      POSTGRES_DB: waygo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - waygo-backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d waygo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - waygo_net

  redis:
    image: redis:7-alpine
    container_name: waygo_redis
    restart: always
    volumes:
      - waygo-backend_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - waygo_net

  app_blue:
    build: .
    container_name: waygo_backend_app_blue
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/waygo_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # --- Multicard ---
      MULTICARD_APPLICATION_ID: ${MULTICARD_APPLICATION_ID:-way_go_uz}
      MULTICARD_SECRET: ${MULTICARD_SECRET:-v8d1o5pkxx1esve8}
      MULTICARD_STORE_ID: ${MULTICARD_STORE_ID:-25591}
      MULTICARD_BASE_URL: ${MULTICARD_BASE_URL:-https://mesh.multicard.uz}
      WAYGO_BACKEND_URL: ${WAYGO_BACKEND_URL:-https://backend.waygo.uz}
      # --- Payme ---
      PAYME_MERCHANT_KEY: ${PAYME_MERCHANT_KEY}
      PAYME_LOGIN: ${PAYME_LOGIN:-Paycom}
      # --- Eskiz SMS ---
      ESKIZ_EMAIL: ${ESKIZ_EMAIL}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}
      SMS_PROVIDER: ${SMS_PROVIDER:-eskiz}
      # --- JWT ---
      WAYGO_JWT_SECRET: ${WAYGO_JWT_SECRET}
    volumes:
      - /var/www/waygo-uploads:/app/uploads
      - /var/www/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      - db
      - redis
    networks:
      - waygo_net

  app_green:
    build: .
    container_name: waygo_backend_app_green
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/waygo_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # --- Multicard ---
      MULTICARD_APPLICATION_ID: ${MULTICARD_APPLICATION_ID:-way_go_uz}
      MULTICARD_SECRET: ${MULTICARD_SECRET:-v8d1o5pkxx1esve8}
      MULTICARD_STORE_ID: ${MULTICARD_STORE_ID:-25591}
      MULTICARD_BASE_URL: ${MULTICARD_BASE_URL:-https://mesh.multicard.uz}
      WAYGO_BACKEND_URL: ${WAYGO_BACKEND_URL:-https://backend.waygo.uz}
      # --- Payme ---
      PAYME_MERCHANT_KEY: ${PAYME_MERCHANT_KEY}
      PAYME_LOGIN: ${PAYME_LOGIN:-Paycom}
      # --- Eskiz SMS ---
      ESKIZ_EMAIL: ${ESKIZ_EMAIL}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}
      SMS_PROVIDER: ${SMS_PROVIDER:-eskiz}
      # --- JWT ---
      WAYGO_JWT_SECRET: ${WAYGO_JWT_SECRET}
    volumes:
      - /var/www/waygo-uploads:/app/uploads
      - /var/www/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      - db
      - redis
    networks:
      - waygo_net

  # Self-hosted OSRM routing fallback (used when Yandex Directions API
  # times out/errors — see MapSettings.osrmBaseUrl). Requires the .osrm
  # data files in ./osrm to exist first — run ./osrm/setup.sh once before
  # starting this service. Not in the default `depends_on` chain for
  # app_blue/app_green: those must keep working even if this is never set
  # up (osrmBaseUrl defaults to the public demo server otherwise).
  osrm:
    image: osrm/osrm-backend
    container_name: waygo_osrm
    restart: always
    command: >
      osrm-routed --algorithm mld --max-table-size 1
      /data/uzbekistan-latest.osrm
    volumes:
      - ./osrm:/data:ro
    networks:
      - waygo_net

  gateway:
    image: nginx:alpine
    container_name: waygo_gateway
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
    depends_on:
      - app_blue
      - app_green
    networks:
      - waygo_net

  db-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: waygo_db_backup
    restart: always
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=waygo_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - SCHEDULING=true
      - BACKUP_NUM_KEEP=14
      - SCHEDULE=0 2 * * *
      - BACKUP_DIR=/backups
      - TZ=Asia/Tashkent
    networks:
      - waygo_net

networks:
  waygo_net:
    driver: bridge

volumes:
  waygo-backend_postgres_data:
    external: true
  waygo-backend_redis_data:
